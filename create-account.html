<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Kisan Sakthi</title>

    <link rel="stylesheet" href="css/create-account.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="container">

        <!-- Left Side -->
        <div class="left">

            <div class="logo">
                🌾 <span>Kisaan Sakthi</span>
            </div>

            <h3>Create Account</h3>
            <p>Join India's Smart Farming Platform</p>

            <form id="registerForm">

                <input type="text" id="name" placeholder="Full Name" required>

                <input type="email" id="email" placeholder="Email Address" required>

                <input type="tel" id="mobile" placeholder="Mobile Number" required>

                <input type="password" id="password" placeholder="Password" required>

                <input type="password" id="confirmPassword" placeholder="Confirm Password" required>

                <button type="submit">Create Account</button>

            </form>

            <div class="login">
                Already have an account?
                <button type="button" class="login-btn" onclick="location.href='login.html'">Login</button>
            </div>

        </div>

        <!-- Right Side -->

        <div class="right">

            <div class="top-logo">
                🌾 Kisan Sakthi
            </div>

            <img src="https://cdn-icons-png.flaticon.com/512/628/628324.png" class="tractor" alt="Tractor">

            <h2>Empowering Farmers</h2>

            <p>
                Smart farming made easy with AI disease detection,
                weather forecasting and crop recommendations.
            </p>

        </div>

    </div>

    <script src="js/create-account.js"></script>

</body>

</html>
