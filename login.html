<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kisan Sakthi | Login</title>

    <link rel="stylesheet" href="css/login.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="container">

    <!-- Left Section -->

    <div class="left">

        <div class="logo">

            <img src="https://cdn-icons-png.flaticon.com/512/2909/2909763.png" alt="Kisan Sakthi Logo">

            <h2>Kisan Sakthi</h2>

        </div>

        <h1>Welcome Back</h1>

        <p>Login to continue smart farming.</p>

        <form id="loginForm">

            <label>Email</label>

            <input
            type="email"
            id="email"
            placeholder="Enter Email"
            required>

            <label>Password</label>

            <input
            type="password"
            id="password"
            placeholder="Enter Password"
            required>

            <div class="forgot">

                <a href="#">Forgot Password?</a>

            </div>

            <button type="submit">

                Login

            </button>

        </form>

        <div class="signup">

            Don't have an account?

            <a href="create-account.html">

                Sign Up

            </a>

        </div>

    </div>

    <!-- Right Section -->

    <div class="right">

        <img src="https://cdn-icons-png.flaticon.com/512/628/628324.png" alt="Tractor">

        <h2>Grow Better With AI</h2>

        <p>

            Detect crop diseases, monitor weather,
            check market prices and improve your farming
            using Kisan Sakthi.

        </p>

    </div>

</div>

<script src="js/login.js"></script>

</body>
</html>
