<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kisan Sakthi | Market Prices</title>

    <link rel="stylesheet" href="css/market-price.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="container">

    <div class="header">

        <button class="back-btn" onclick="history.back()">

            <i class="fa-solid fa-arrow-left"></i>

        </button>

        <h1>Market Prices</h1>

    </div>

    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="Search Market (Warangal, Parkal, Hanamkonda...)">

        <button onclick="searchMarket()">

            Search

        </button>

    </div>

    <div id="marketContainer"></div>

</div>

<script src="js/market-price.js"></script>

</body>

</html>
